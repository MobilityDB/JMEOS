name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches:
      - main
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Maven
        run: mvn -B wrapper:wrapper

      # Derive the MEOS catalog from upstream MobilityDB master in CI — it is not
      # committed. Catalog-only (build-libmeos: false): javadoc compiles the sources but
      # never runs them, so the native libmeos is not needed here.
      - name: Provision MEOS catalog
        id: provision
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master
          build-libmeos: "false"

      # Stage the derived catalog where FunctionsGenerator reads it at build time.
      # The catalog is gitignored — it only ever exists as a build artifact.
      - name: Stage the derived catalog for the generator
        run: |
          mkdir -p codegen/input
          cp "${{ steps.provision.outputs.catalog-path }}" codegen/input/meos-idl.json

      - name: Build sources
        run: mvn -B -DskipTests compile
        # Compiles the codegen module and generates functions/GeneratedFunctions.java, so the
        # generate-meos-facade step invoked by javadoc:javadoc finds the FunctionsGenerator class.

      - name: Generate Javadoc
        run: mvn -B javadoc:javadoc
        # By default, this generates Javadoc in the target/site/apidocs/ directory

      - name: Verify Javadoc Directory
        run: |
          if [ -d "jmeos-core/target/site/apidocs" ]; then
          echo "Javadoc generated successfully";
          ls -la jmeos-core/target/site/apidocs;
          else
          echo "Javadoc directory not found!";
          exit 1;
          fi

      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: jmeos-core/target/site/apidocs
