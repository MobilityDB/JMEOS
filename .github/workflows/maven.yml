name: Java CI with Maven

on:
  push:
    branches-ignore: gh-pages
  pull_request:
    branches-ignore: gh-pages

jobs:
  # The tree is checked before anything is built: the four rules read
  # `git ls-files` and nothing else, so a finding arrives in seconds rather than
  # after a libmeos build. The rules live in MEOS-API beside the catalog and the
  # provisioning recipe, so this repository carries no copy of them to go stale.
  hygiene:
    name: Tree hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked build output, skipped suites and stale pins
        uses: MobilityDB/MEOS-API/.github/actions/check-tree-hygiene@master

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Uninstall any pre-installed Maven
        run: |
          sudo apt-get remove --purge -y maven
          sudo rm -f /usr/bin/mvn
          sudo rm -rf /usr/share/maven /etc/maven /usr/local/maven /opt/apache-maven*

      - name: Install Maven 3.9.6
        run: |
          wget https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          sudo mv apache-maven-3.9.6 /opt/
          sudo ln -s /opt/apache-maven-3.9.6/bin/mvn /usr/bin/mvn
          mvn -version

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Derive the MEOS catalog (meos-idl.json via run.py) and build+install the
      # all-families libmeos.so from upstream MobilityDB master, through the shared
      # composite action. It does the full libmeos provisioning itself (PostgreSQL purge,
      # PGDG, PG17, build deps, cmake, install under /usr/local), so no inline apt/PG/cmake
      # steps are needed here. Both artifacts come from the same commit in the same run, and
      # the source moves with the @master toolchain that derives it, so neither can skew.
      - name: Provision MEOS catalog + libmeos
        id: provision
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master
          build-libmeos: "true"

      # Stage the derived catalog where FunctionsGenerator reads it at build time.
      # The catalog is gitignored — it only ever exists as a build artifact.
      - name: Stage the derived catalog for the generator
        run: |
          mkdir -p codegen/input
          cp "${{ steps.provision.outputs.catalog-path }}" codegen/input/meos-idl.json

      # Copy the installed library to the project's src directory (the action installs
      # libmeos under /usr/local) and expose it via LD_LIBRARY_PATH.
      - name: Copy MEOS library to JMEOS/src/
        run: cp /usr/local/lib/libmeos.so $GITHUB_WORKSPACE/jmeos-core/src/

      - name: Set up LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(pwd)/jmeos-core/src/" >> $GITHUB_ENV

      - name: Build with Maven
        run: |
          set -o pipefail
          mvn clean install | tee "$RUNNER_TEMP/build.log"

      # The build's own summary states two things this job's conclusion does
      # not: a test reported SKIPPED asserts nothing while the job still reads
      # success, and a test the run never collects appears in no count at all,
      # so removing one leaves the skip number at zero. The floor is what
      # guards the second. Raise it when the suite grows; lowering it belongs
      # in the commit that accounts for the removal.
      - name: Refuse a skip, and a suite that shrank
        uses: MobilityDB/MEOS-API/.github/actions/check-test-outcome@master
        with:
          log: ${{ runner.temp }}/build.log
          min-tests: "1894"
